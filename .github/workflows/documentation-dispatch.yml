name: Documentation Dispatch

on:
  repository_dispatch:
    types:
      - documentation_update_requested

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: documentation-generation
  cancel-in-progress: false

jobs:

  documentation-generation:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Documentation Repository
        uses: actions/checkout@v4

      - name: Show Payload
        run: |
          echo "=================================="
          echo "DISPATCH PAYLOAD"
          echo "=================================="
          echo '${{ toJson(github.event.client_payload) }}'

      - name: Create doc-request.json
        run: |
          cat > doc-request.json << 'EOF'
          ${{ toJson(github.event.client_payload) }}
          EOF

          echo "=================================="
          echo "DOC REQUEST CONTENT"
          echo "=================================="

          cat doc-request.json

          echo ""
          echo "=================================="
          echo "PRODUCT"
          echo "=================================="

          grep -i product doc-request.json || true

          echo ""
          echo "=================================="
          echo "CAPABILITIES"
          echo "=================================="

          grep -i capabilities doc-request.json || true

          echo ""
          echo "=================================="
          echo "IMPACTED CAPABILITIES"
          echo "=================================="

          grep -i impacted_capabilities doc-request.json || true

          echo ""
          echo "=================================="
          echo "CHANGED FILES"
          echo "=================================="

          grep -i changed_files doc-request.json || true

      - name: Clone Actions Repository
        env:
          PAT: ${{ secrets.CENTRAL_DOCS_TOKEN }}
        run: |
          rm -rf _actions

          git clone \
            https://x-access-token:${PAT}@github.com/jijeeshlab/Actions.git \
            _actions

      - name: Clone Template Repository
        env:
          PAT: ${{ secrets.CENTRAL_DOCS_TOKEN }}
        run: |
          rm -rf template

          git clone \
            https://x-access-token:${PAT}@github.com/jijeeshlab/doc-templete.git \
            template

      - name: Verify Catalog Files
        run: |
          echo "=================================="
          echo "CATALOG FILES"
          echo "=================================="

          find catalog -type f | sort

          echo ""
          echo "=================================="
          echo "PRODUCT CATALOG"
          echo "=================================="

          cat catalog/product-catalog.yaml

          echo ""
          echo "=================================="
          echo "CAPABILITY CATALOG"
          echo "=================================="

          cat catalog/capability-catalog.yaml

          echo ""
          echo "=================================="
          echo "TECHNOLOGY CATALOG"
          echo "=================================="

          cat catalog/technology-catalog.yaml

      - name: Clone Source Repository
        env:
          PAT: ${{ secrets.CENTRAL_DOCS_TOKEN }}
        run: |
          rm -rf source

          git clone \
            https://x-access-token:${PAT}@github.com/${{ github.event.client_payload.source_repo_full }}.git \
            source

      - name: Show Source Repository Files
        run: |
          echo "=================================="
          echo "SOURCE FILES"
          echo "=================================="

          find source -type f | sort

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Verify Agent Files
        run: |
          echo "=================================="
          echo "AGENT FILES"
          echo "=================================="

          find _actions/agents -type f | sort || true

      - name: Generate Agent Based Documentation
        run: |
          echo "=================================="
          echo "RUNNING PRODUCT-CENTRIC GENERATOR"
          echo "=================================="

          python _actions/scripts/generate-agent-docs.py

      - name: Verify Generated HLD Files
        run: |
          echo "=================================="
          echo "GENERATED HLD FILES"
          echo "=================================="

          find docs/02-Architecture-and-Designs/01-High-Level-Designs \
            -name "*.md" \
            -type f \
            -exec ls -lah {} \;

      - name: Verify Generated LLD Files
        run: |
          echo "=================================="
          echo "GENERATED LLD FILES"
          echo "=================================="

          find docs/02-Architecture-and-Designs/02-Low-Level-Designs \
            -name "*.md" \
            -type f \
            -exec ls -lah {} \;

      - name: Display Generated Documents
        run: |
          echo ""
          echo "=================================="
          echo "GENERATED DOCUMENTS"
          echo "=================================="

          find docs -name "*.md" -type f | while read file
          do
            echo ""
            echo "FILE: $file"
            echo "----------------------------------"
            cat "$file"
          done

      - name: Validate Documentation Content
        run: |
          echo "=================================="
          echo "DOCUMENT VALIDATION"
          echo "=================================="

          HLD_COUNT=$(find docs/02-Architecture-and-Designs/01-High-Level-Designs -name "*.md" | wc -l)

          LLD_COUNT=$(find docs/02-Architecture-and-Designs/02-Low-Level-Designs -name "*.md" | wc -l)

          echo "HLD FILES: $HLD_COUNT"
          echo "LLD FILES: $LLD_COUNT"

          if [ "$HLD_COUNT" -eq 0 ]; then
            echo "No HLD documents generated"
            exit 1
          fi

          if [ "$LLD_COUNT" -eq 0 ]; then
            echo "No LLD documents generated"
            exit 1
          fi

          echo "Documentation validation passed"

      - name: Update Navigation
        run: |
          python _actions/scripts/update-navigation.py

      - name: Show Generated Files
        run: |
          echo "=================================="
          echo "GENERATED FILES"
          echo "=================================="

          find docs -type f | sort

      - name: Cleanup Temporary Files
        run: |
          rm -rf _actions
          rm -rf source
          rm -rf template
          rm -rf generated
          rm -f doc-request.json

      - name: Commit Documentation
        run: |
          echo "=================================="
          echo "COMMIT DOCUMENTATION"
          echo "=================================="

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs

          if [ -f mkdocs.yml ]; then
            git add mkdocs.yml
          fi

          if [ -f documentation-index.yaml ]; then
            git add documentation-index.yaml
          fi

          if git diff --cached --quiet; then
            echo "No documentation changes."
            exit 0
          fi

          git commit -m "Generate product-centric architecture documentation"

          for i in 1 2 3
          do
            echo ""
            echo "Push attempt $i"

            git pull --rebase origin main

            if git push origin HEAD:main
            then
              echo "Push successful"
              exit 0
            fi

            echo "Retrying..."
            sleep 5
          done

          exit 1