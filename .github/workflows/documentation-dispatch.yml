name: Documentation Dispatch

on:
  repository_dispatch:
    types:
      - documentation_update_requested

  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: documentation-generation
  cancel-in-progress: false

jobs:

  documentation-generation:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Documentation Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.dispatch_data.branch }}
          token: ${{ secrets.CENTRAL_DOCS_TOKEN }}
          
      - name: Show Payload
        run: |
          echo "=================================="
          echo "DISPATCH PAYLOAD"
          echo "=================================="
          echo '${{ toJson(github.event.client_payload) }}'

      - name: Create doc-request.json
        run: |
          cat > doc-request.json << 'EOF'
          ${{ toJson(github.event.client_payload.dispatch_data) }}
          EOF

          echo "=================================="
          echo "DOC REQUEST CONTENT"
          echo "=================================="

          cat doc-request.json

      - name: Clone Actions Repository
        env:
          PAT: ${{ secrets.CENTRAL_DOCS_TOKEN }}
        run: |
          rm -rf _actions

          git clone \
            https://x-access-token:${PAT}@github.com/jijeeshlearningorg/Actions.git \
            _actions

      - name: Clone Template Repository
        env:
          PAT: ${{ secrets.CENTRAL_DOCS_TOKEN }}
        run: |
          rm -rf template

          git clone \
            https://x-access-token:${PAT}@github.com/jijeeshlearningorg/doc-templete.git \
            template

      - name: Verify Catalog Files
        run: |
          echo "=================================="
          echo "CATALOG FILES"
          echo "=================================="

          find catalog -type f | sort || true

          cat catalog/product-catalog.yaml || true
          cat catalog/capability-catalog.yaml || true
          cat catalog/technology-catalog.yaml || true

      - name: Clone Source Repository
        env:
          PAT: ${{ secrets.CENTRAL_DOCS_TOKEN }}
        run: |
          rm -rf source

          BRANCH="${{ github.event.client_payload.dispatch_data.branch }}"

          echo "=================================="
          echo "SOURCE REPOSITORY"
          echo "=================================="

          echo "${{ github.event.client_payload.dispatch_data.source_repo_full }}"
          echo "Branch : $BRANCH"

          git clone \
            --single-branch \
            --branch "$BRANCH" \
            https://x-access-token:${PAT}@github.com/${{ github.event.client_payload.dispatch_data.source_repo_full }}.git \
            source

      - name: Show Source Repository Files
        run: |
          echo "=================================="
          echo "SOURCE FILES"
          echo "=================================="

          find source -type f | sort

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic pyyaml requests

      - name: Test Claude API
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |   
          python _actions/scripts/test_claude.py
          
      - name: Verify Actions Repository
        run: |
          echo "=================================="
          echo "ACTIONS CONTENT"
          echo "=================================="

          find _actions -type f | sort || true

      - name: Verify Templates
        run: |
          echo "=================================="
          echo "TEMPLATE CONTENT"
          echo "=================================="

          find template -type f | sort || true

      - name: Build Documentation Context
        run: |
          echo "=================================="
          echo "BUILD DOCUMENTATION CONTEXT"
          echo "=================================="

          python _actions/scripts/build-document-context.py

          echo "=================================="
          echo "GENERATED CONTEXT"
          echo "=================================="

          cat generated-context.json

      - name: Generate Copilot Prompts
        run: |
          echo "=================================="
          echo "GENERATE COPILOT PROMPTS"
          echo "=================================="

          python _actions/scripts/copilot-generator.py

          echo "=================================="
          echo "PROMPT FILES"
          echo "=================================="

          find _actions/prompts -type f | sort || true

      - name: Invoke Claude AI
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "=================================="
          echo "CLAUDE AI GENERATION"
          echo "=================================="

          python _actions/scripts/invoke-claude.py

      - name: Show Generated AI Files
        run: |
          echo "=================================="
          echo "AI GENERATED FILES"
          echo "=================================="

          find generated -type f | sort || true

      - name: Render Documentation Templates
        run: |
          echo "=================================="
          echo "RENDER DOCUMENTATION"
          echo "=================================="

          python _actions/scripts/template-renderer.py

      - name: Verify Generated HLD Files
        run: |
          echo "=================================="
          echo "HLD FILES"
          echo "=================================="

          find docs/02-Architecture-and-Designs/01-High-Level-Designs \
            -name "*.md" \
            -type f \
            | sort || true

      - name: Verify Generated LLD Files
        run: |
          echo "=================================="
          echo "LLD FILES"
          echo "=================================="

          find docs/02-Architecture-and-Designs/02-Low-Level-Designs \
            -name "*.md" \
            -type f \
            | sort || true

      - name: Verify Generated BIG Files
        run: |
          echo "=================================="
          echo "BIG FILES"
          echo "=================================="

          find docs -iname "*big*.md" | sort || true

      - name: Verify Generated OPG Files
        run: |
          echo "=================================="
          echo "OPG FILES"
          echo "=================================="

          find docs -iname "*opg*.md" | sort || true

      - name: Verify Generated Lifecycle Files
        run: |
          echo "=================================="
          echo "LIFECYCLE FILES"
          echo "=================================="

          find docs -iname "*lifecycle*.md" | sort || true

      - name: Validate Documentation Content
        run: |
          HLD_COUNT=$(find docs/02-Architecture-and-Designs/01-High-Level-Designs -name "*.md" 2>/dev/null | wc -l)

          LLD_COUNT=$(find docs/02-Architecture-and-Designs/02-Low-Level-Designs -name "*.md" 2>/dev/null | wc -l)

          echo "=================================="
          echo "DOCUMENT COUNTS"
          echo "=================================="

          echo "HLD FILES: $HLD_COUNT"
          echo "LLD FILES: $LLD_COUNT"

          if [ "$HLD_COUNT" -eq 0 ]; then
            echo "No HLD documents generated"
            exit 1
          fi

          if [ "$LLD_COUNT" -eq 0 ]; then
            echo "No LLD documents generated"
            exit 1
          fi

      - name: Update Navigation
        run: |
          echo "=================================="
          echo "UPDATE NAVIGATION"
          echo "=================================="

          python _actions/scripts/update-navigation.py

      - name: Show Generated Documentation
        run: |
          echo "=================================="
          echo "GENERATED DOCUMENTS"
          echo "=================================="

          find docs -type f | sort

      - name: Cleanup Temporary Files
        run: |
          rm -rf source
          rm -rf template
          rm -f doc-request.json

      - name: Commit Documentation
        env:
          PAT: ${{ secrets.CENTRAL_DOCS_TOKEN }}
        run: |

          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs

          if [ -f mkdocs.yml ]; then
            git add mkdocs.yml
          fi

          if [ -f documentation-index.yaml ]; then
            git add documentation-index.yaml
          fi

          if git diff --cached --quiet; then
            echo "=================================="
            echo "NO DOCUMENTATION CHANGES"
            echo "=================================="
            exit 0
          fi

          echo "=================================="
          echo "COMMITTING DOCUMENTATION"
          echo "=================================="

          git commit -m "Generate Copilot architecture documentation"

          echo "=================================="
          echo "CONFIGURE REMOTE"
          echo "=================================="

          git remote set-url origin \
            https://x-access-token:${PAT}@github.com/jijeeshlearningorg/doc-as-code.git

          echo "=================================="
          echo "FORCE PUSH GENERATED DOCUMENTATION"
          echo "=================================="

          BRANCH="${{ github.event.client_payload.dispatch_data.branch }}"
          
          echo "=================================="
          echo "TARGET DOCUMENTATION BRANCH"
          echo "=================================="

          echo "$BRANCH"

          git push origin HEAD:$BRANCH --force

          echo "=================================="
          echo "DOCUMENTATION PUSH COMPLETE"
          echo "=================================="
